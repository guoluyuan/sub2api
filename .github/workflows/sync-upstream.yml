name: Sync Upstream

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          token: \$\{\{ secrets.GITHUB_TOKEN \}\}
          fetch-depth: 0

      - name: Sync upstream main
        id: sync
        run: |
          set -euo pipefail

          git config user.name "guoluyuan-sync[bot]"
          git config user.email "guoluyuan-sync[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          git fetch upstream main --tags

          BEFORE=$(git rev-parse HEAD)
          git merge --no-edit upstream/main
          AFTER=$(git rev-parse HEAD)

          if [ "$BEFORE" = "$AFTER" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        if: steps.sync.outputs.changed == 'true'
        id: tag
        run: |
          set -euo pipefail

          VERSION=$(tr -d '\r\n' < backend/cmd/server/VERSION)
          TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MESSAGE=$(git tag -l --format='%(contents)' "$TAG" || true)
          if [ -z "$MESSAGE" ]; then
            MESSAGE="Sync upstream ${TAG}"
          fi

          git tag -a "$TAG" -m "$MESSAGE" HEAD
          git push origin "$TAG"

          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Trigger release workflow
        if: steps.tag.outputs.created == 'true'
        env:
          GH_token: \$\{\{ secrets.GITHUB_TOKEN \}\}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh workflow run release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f tag="${TAG}" \
            -f simple_release=false