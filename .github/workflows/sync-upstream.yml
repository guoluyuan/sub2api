name: Sync Upstream

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Validate sync token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN secret is required. Create a token with repo and workflow scopes."
            exit 1
          fi

      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          fetch-depth: 0

      - name: Sync upstream main
        id: sync
        run: |
          set -euo pipefail

          git config user.name "guoluyuan-sync[bot]"
          git config user.email "guoluyuan-sync[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          git fetch upstream main

          BEFORE=$(git rev-parse HEAD)
          git merge --no-edit upstream/main
          AFTER=$(git rev-parse HEAD)

          if [ "$BEFORE" = "$AFTER" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        if: steps.sync.outputs.changed == 'true'
        id: tag
        run: |
          set -euo pipefail

          VERSION=$(tr -d '\r\n' < backend/cmd/server/VERSION)
          TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git log -1 --pretty=%B upstream/main > .release-tag-message.txt
          git tag -a "$TAG" -F .release-tag-message.txt HEAD
          git push origin "$TAG"

          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"