name: Sync Upstream

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Validate sync token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN secret is required. Create a token with repo and workflow scopes."
            exit 1
          fi

      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          fetch-depth: 0

      - name: Sync upstream main
        id: sync
        run: |
          set -euo pipefail

          git config user.name "guoluyuan-sync[bot]"
          git config user.email "guoluyuan-sync[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          git fetch upstream main

          BEFORE=$(git rev-parse HEAD)
          git merge --no-edit upstream/main
          AFTER=$(git rev-parse HEAD)

          if [ "$BEFORE" = "$AFTER" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        if: steps.sync.outputs.changed == 'true'
        id: tag
        run: |
          set -euo pipefail

          VERSION=$(tr -d '\r\n' < backend/cmd/server/VERSION)
          TAG="v${VERSION}"

          ORIGIN_TAG_EXISTS=false
          ORIGIN_TAG_COMMIT=""
          if ORIGIN_TAG_LINE=$(git ls-remote --exit-code --tags origin "refs/tags/${TAG}" 2>/dev/null); then
            ORIGIN_TAG_EXISTS=true
            ORIGIN_TAG_COMMIT=$(printf '%s\n' "$ORIGIN_TAG_LINE" | awk '{print $1}')
          fi
          if ORIGIN_TAG_LINE=$(git ls-remote --exit-code --tags origin "refs/tags/${TAG}^{}" 2>/dev/null); then
            ORIGIN_TAG_COMMIT=$(printf '%s\n' "$ORIGIN_TAG_LINE" | awk '{print $1}')
          fi
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "$ORIGIN_TAG_COMMIT" = "$HEAD_COMMIT" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          UPSTREAM_TAG_REF="refs/upstream-tags/${TAG}"
          git update-ref -d "$UPSTREAM_TAG_REF" 2>/dev/null || true

          if ! git fetch --no-tags upstream "refs/tags/${TAG}:${UPSTREAM_TAG_REF}"; then
            echo "::error::Upstream tag ${TAG} not found; cannot copy release notes."
            exit 1
          fi

          if [ "$(git cat-file -t "$UPSTREAM_TAG_REF")" != "tag" ]; then
            echo "::error::Upstream ${TAG} is not an annotated tag; cannot copy release notes."
            exit 1
          fi

          git cat-file -p "$UPSTREAM_TAG_REF" | sed '1,/^$/d' > .release-tag-message.txt
          if [ ! -s .release-tag-message.txt ]; then
            echo "::error::Upstream tag ${TAG} has empty release notes."
            exit 1
          fi

          git tag -d "$TAG" 2>/dev/null || true
          git tag -a "$TAG" -F .release-tag-message.txt HEAD
          if [ "$ORIGIN_TAG_EXISTS" = "true" ]; then
            git push --force origin "$TAG"
          else
            git push origin "$TAG"
          fi

          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
